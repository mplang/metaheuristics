[project]
name = "metaheuristics"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "levenshtein>=0.27.5",
    "matplotlib>=3.11.2",
    "pathos>=0.3.5",
    "pillow>=13.0.0",
    "progressbar2>=4.6.0",
]

[dependency-groups]
dev = [
    "ipython>=9.18.0",
]

[tool.ruff]
target-version = "py314"
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]   # pycodestyle, pyflakes, isort, pyupgrade, bugbear
